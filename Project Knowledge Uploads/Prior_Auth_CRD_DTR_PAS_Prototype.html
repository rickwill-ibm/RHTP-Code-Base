<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Provider Portal &middot; Prior Authorization (CRD &middot; DTR &middot; PAS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   1. DESIGN TOKENS
   Palette derived from the existing "Provider Portal" app (slate-blue header,
   blue CTA buttons, blue link-styled table text, black bold page titles).
   ========================================================================== */
:root{
  --header-bg: #5d7a94;
  --header-bg-dark: #4a6580;
  --badge-bg: #eef3f8;
  --badge-border: #c9d6e3;

  --primary: #1669c1;
  --primary-dark: #0f52a0;
  --primary-light: #e7f0fb;

  --link: #1669c1;

  --bg: #f4f6f8;
  --card-bg: #ffffff;
  --border: #e1e5ea;
  --border-strong: #cdd4dc;

  --text: #1a1d21;
  --text-muted: #5b6470;
  --text-light: #8992a0;

  --green: #1e8e5a;
  --green-bg: #e6f4ec;
  --green-border: #bfe3cf;

  --amber: #b06a00;
  --amber-bg: #fdf1de;
  --amber-border: #f2d7a3;

  --red: #d0281d;
  --red-bg: #fdeae8;
  --red-border: #f4c3bf;

  --teal: #0f8a86;
  --teal-bg: #e3f5f4;
  --teal-border: #bfe6e4;

  --blue-pill: #1669c1;
  --blue-pill-bg: #e7f0fb;
  --blue-pill-border: #bfd7f4;

  --gray-pill: #667085;
  --gray-pill-bg: #eef1f4;
  --gray-pill-border: #d7dce2;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --shadow-lg: 0 4px 14px rgba(16,24,40,.12);
}

/* ==========================================================================
   2. RESET / BASE
   ========================================================================== */
*, *::before, *::after{ box-sizing: border-box; }
html, body{ margin:0; padding:0; }
body{
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  line-height: 1.45;
}
h1,h2,h3,h4{ font-family:'Poppins','Inter',sans-serif; margin:0; font-weight:700; }
p{ margin:0; }
button{ font-family:inherit; cursor:pointer; }
a{ color: var(--link); text-decoration:none; }
a:hover{ text-decoration:underline; }
ul{ margin:0; padding:0; list-style:none; }
input[type="radio"], input[type="checkbox"]{ accent-color: var(--primary); }
::selection{ background: var(--primary-light); }

/* ==========================================================================
   3. APP HEADER (matches reference "Provider Portal" bar)
   ========================================================================== */
.app-header{
  background: linear-gradient(180deg, var(--header-bg), var(--header-bg-dark));
  color:#fff;
  padding: 16px 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}
.app-header-left{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.app-header-title{ font-family:'Poppins',sans-serif; font-weight:700; font-size:22px; letter-spacing:.2px; }
.app-header-badge{
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.3px;
  text-transform:uppercase;
  background: rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.35);
  color:#fff;
  padding:5px 11px;
  border-radius:999px;
}
.app-header-right{ display:flex; align-items:center; gap:10px; }
.avatar{
  width:34px; height:34px; border-radius:50%;
  background:#dfe7ee; color:var(--header-bg-dark);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:13px;
  border:2px solid rgba(255,255,255,.6);
}
.provider-name{ font-size:14.5px; font-weight:600; }

/* Screen navigation strip (jump to any of the 6 screens) */
.screen-nav{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding: 0 24px;
  display:flex;
  gap:4px;
  overflow-x:auto;
}
.screen-nav-item{
  border:none;
  background:transparent;
  padding:14px 16px 12px;
  font-size:13.5px;
  font-weight:600;
  color: var(--text-muted);
  border-bottom:3px solid transparent;
  white-space:nowrap;
  transition: color .15s ease, border-color .15s ease;
}
.screen-nav-item:hover{ color: var(--text); }
.screen-nav-item.active{ color: var(--primary); border-bottom-color: var(--primary); }
.screen-nav-item .step-num{
  display:inline-flex; align-items:center; justify-content:center;
  width:18px; height:18px; border-radius:50%;
  background: var(--gray-pill-bg); color:var(--text-muted);
  font-size:10.5px; font-weight:700; margin-right:7px;
}
.screen-nav-item.active .step-num{ background: var(--primary); color:#fff; }

/* ==========================================================================
   4. LAYOUT / MAIN
   ========================================================================== */
.app-main{
  max-width: 1180px;
  margin: 0 auto;
  padding: 32px 24px 80px;
}
.view[hidden]{ display:none; }
.page-title{ font-size:26px; color:#111; margin-bottom:4px; }
.page-subtitle{ color: var(--text-muted); font-size:14px; margin-bottom:24px; }
.page-head-row{
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
  margin-bottom: 22px; flex-wrap:wrap;
}

/* Card */
.card{
  background: var(--card-bg);
  border:1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 24px;
  margin-bottom: 20px;
}
.card-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
.card-title{ font-size:16px; }
.card-title-sm{ font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); font-weight:700; }

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius: var(--radius-sm);
  border:1px solid transparent;
  padding: 11px 22px;
  font-size: 13.5px;
  font-weight:700;
  letter-spacing:.3px;
  transition: background .15s ease, box-shadow .15s ease, opacity .15s ease;
  white-space:nowrap;
}
.btn-primary{ background: var(--primary); color:#fff; }
.btn-primary:hover{ background: var(--primary-dark); }
.btn-primary:disabled{ background:#a9c2e0; cursor:not-allowed; }
.btn-secondary{ background:#fff; color: var(--primary); border-color: var(--border-strong); }
.btn-secondary:hover{ background: var(--primary-light); }
.btn-ghost{ background:transparent; color: var(--primary); padding:8px 10px; font-weight:600; }
.btn-ghost:hover{ text-decoration:underline; }
.btn-sm{ padding:7px 14px; font-size:12.5px; }
.btn-block{ width:100%; }

/* Patient banner */
.patient-banner{
  background: linear-gradient(180deg,#fbfcfd,#f4f7fa);
  border:1px solid var(--border);
  border-left:5px solid var(--header-bg);
  border-radius: var(--radius);
  padding:18px 22px;
  display:flex; flex-wrap:wrap; gap:28px; align-items:center;
  margin-bottom:20px;
}
.patient-banner .pb-name{ font-family:'Poppins',sans-serif; font-weight:700; font-size:17px; }
.patient-banner .pb-field{ font-size:13px; color:var(--text-muted); }
.patient-banner .pb-field b{ color:var(--text); font-weight:600; }

/* Key/value grid */
.kv-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap:16px 28px; }
.kv-item .kv-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-light); font-weight:700; margin-bottom:4px; }
.kv-item .kv-value{ font-size:14.5px; font-weight:600; color:var(--text); }
.kv-item .kv-sub{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }

/* Spinner / loading */
.loading-block{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding: 46px 20px; color: var(--text-muted); }
.spinner{
  width:34px; height:34px; border-radius:50%;
  border:3.5px solid var(--border);
  border-top-color: var(--primary);
  animation: spin .8s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }
.loading-text{ font-size:14px; font-weight:600; }
.loading-sub{ font-size:12.5px; color:var(--text-light); }

/* ==========================================================================
   5. CHECKLIST (CRD Part I) — crisp checklist card pattern from reference
   ========================================================================== */
.checklist{ display:flex; flex-direction:column; }
.checklist-row{
  display:flex; gap:14px; align-items:flex-start;
  padding:16px 4px;
  border-bottom:1px solid var(--border);
}
.checklist-row:last-child{ border-bottom:none; }
.check-icon{
  flex:0 0 auto;
  width:24px; height:24px; border-radius:50%;
  background: var(--green-bg); border:1.5px solid var(--green-border);
  display:flex; align-items:center; justify-content:center;
  margin-top:1px;
}
.check-icon svg{ width:13px; height:13px; }
.checklist-row .cl-label{ font-weight:700; font-size:14.5px; color: var(--text); }
.checklist-row .cl-detail{ font-size:13px; color: var(--text-muted); margin-top:3px; }
.checklist-row .cl-detail b{ color:var(--text); font-weight:600; }
.src-badge{
  display:inline-flex; align-items:center;
  font-size:10.5px; font-weight:700; letter-spacing:.3px; text-transform:uppercase;
  padding:2px 7px; border-radius:999px;
  margin-left:8px; vertical-align:middle;
}
.src-badge.emr{ background:#eaf1fc; color:#1a5aa8; border:1px solid #c6d9f2; }
.src-badge.pa{ background:#f2ecfb; color:#6931b0; border:1px solid #ddccf3; }
.src-badge.upload{ background:#fbeee0; color:#a15a11; border:1px solid #f0d3b0; }

/* ==========================================================================
   6. STATUS PILLS (Auth status + requirement group status)
   ========================================================================== */
.pill{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:4px 11px; border-radius:999px; border:1px solid transparent; white-space:nowrap; }
.pill-blue{ background: var(--blue-pill-bg); color: var(--blue-pill); border-color: var(--blue-pill-border); }
.pill-amber{ background: var(--amber-bg); color: var(--amber); border-color: var(--amber-border); }
.pill-green{ background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
.pill-teal{ background: var(--teal-bg); color: var(--teal); border-color: var(--teal-border); }
.pill-red{ background: var(--red-bg); color: var(--red); border-color: var(--red-border); }
.pill-gray{ background: var(--gray-pill-bg); color: var(--gray-pill); border-color: var(--gray-pill-border); }
.pill-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

.channel-badge{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:6px; border:1px solid var(--border-strong); background:#fafbfc; color:var(--text-muted); }
.channel-badge.fhir{ color:#1a5aa8; border-color:#c6d9f2; background:#eaf1fc; }
.channel-badge.edi{ color:#5b6470; border-color:#d7dce2; background:#eef1f4; }

/* ==========================================================================
   7. DTR ACCORDION / TREE (Part II)
   ========================================================================== */
.dtr-root{
  background: linear-gradient(180deg,#fbfcfd,#f4f7fa);
  border:1px solid var(--border);
  border-radius: var(--radius);
  padding:18px 22px;
  margin-bottom:18px;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
}
.dtr-root .dtr-root-title{ font-size:16.5px; }
.dtr-root .dtr-root-sub{ font-size:12.5px; color:var(--text-muted); margin-top:3px; }
.progress-chip{
  display:flex; align-items:center; gap:10px;
  background:#fff; border:1px solid var(--border-strong); border-radius:999px;
  padding:8px 16px;
}
.progress-chip .pc-text{ font-size:13px; font-weight:700; }
.progress-track{ width:90px; height:7px; border-radius:999px; background:var(--border); overflow:hidden; }
.progress-fill{ height:100%; background: var(--green); border-radius:999px; transition: width .3s ease; }

.tree-group{ border:1px solid var(--border); border-radius: var(--radius); margin-bottom:12px; overflow:hidden; }
.tree-group-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 18px; background:#fff; border:none; width:100%; text-align:left;
}
.tree-group-head:hover{ background:#fafbfc; }
.tree-group-head-left{ display:flex; align-items:center; gap:12px; }
.chevron{ display:inline-block; width:9px; height:9px; border-right:2px solid var(--text-light); border-bottom:2px solid var(--text-light); transform:rotate(-45deg); transition: transform .15s ease; }
.tree-group.open .chevron{ transform: rotate(45deg); }
.tree-group-title{ font-weight:700; font-size:14.5px; }
.tree-group-title .grp-num{ color:var(--text-light); font-weight:600; margin-right:6px; }
.tree-group-body{ padding: 4px 18px 18px 44px; border-top:1px solid var(--border); background:#fdfdfe; }

.leaf-row{ padding:12px 0; border-bottom:1px dashed var(--border); }
.leaf-row:last-child{ border-bottom:none; }
.leaf-code{ font-weight:700; font-size:13.5px; font-family: 'SFMono-Regular', Menlo, monospace; color:var(--text); background:#fff; border:1px solid var(--border-strong); padding:1px 7px; border-radius:5px; display:inline-block; }
.leaf-evidence{ font-size:13px; color:var(--text-muted); margin-top:6px; }
.leaf-evidence b{ color:var(--text); font-weight:600; }

.gap-code-list{ margin: 6px 0 14px; }
.gap-code-item{ display:flex; align-items:center; gap:10px; padding:7px 0; font-size:13px; color:var(--text-muted); }
.gap-code-item .gap-dot{ width:8px; height:8px; border-radius:50%; border:1.5px solid var(--red-border); flex:0 0 auto; }
.gap-code-item code{ font-family:'SFMono-Regular', Menlo, monospace; font-size:12px; background:#fff; border:1px solid var(--border-strong); padding:1px 6px; border-radius:4px; color:var(--text); }
.gap-note{ font-size:12.5px; color:var(--text-light); font-style:italic; margin:8px 0 14px; }

/* Upload dropzone */
.dropzone{
  border:2px dashed var(--border-strong);
  border-radius: var(--radius);
  background:#fafbfc;
  padding: 26px 20px;
  text-align:center;
  margin: 6px 0 16px;
}
.dropzone.drag-over{ background: var(--primary-light); border-color: var(--primary); }
.dropzone-icon{ font-size:26px; margin-bottom:8px; }
.dropzone-text{ font-size:13.5px; color:var(--text-muted); margin-bottom:12px; }
.uploaded-file-chip{
  display:inline-flex; align-items:center; gap:10px;
  background: var(--green-bg); border:1px solid var(--green-border); color:var(--green);
  padding:9px 14px; border-radius: var(--radius-sm); font-size:13px; font-weight:600;
  margin-top:6px;
}

/* ==========================================================================
   8. TABLE (Auth list — blue link-styled headers/IDs like reference)
   ========================================================================== */
.tab-strip{ display:flex; gap:26px; border-bottom:1px solid var(--border); margin-bottom:0; overflow-x:auto; }
.tab-item{ background:none; border:none; padding:12px 2px 12px; font-size:14px; font-weight:600; color:var(--text); border-bottom:3px solid transparent; white-space:nowrap; }
.tab-item.active{ color: var(--primary); border-bottom-color: var(--primary); }
.tab-item .tab-count{ color: var(--text-light); font-weight:500; margin-left:4px; }

.data-table{ width:100%; border-collapse:collapse; background:#fff; }
.data-table thead th{
  text-align:left; font-size:13px; font-weight:700; color: var(--link);
  padding:14px 14px; border-bottom:1px solid var(--border);
  white-space:nowrap;
}
.data-table tbody td{ padding:14px 14px; font-size:13.5px; border-bottom:1px solid var(--border); vertical-align:middle; }
.data-table tbody tr:hover{ background:#fafbfc; cursor:pointer; }
.data-table tbody tr:last-child td{ border-bottom:none; }
.table-wrap{ background:#fff; border:1px solid var(--border); border-top:none; border-radius:0 0 var(--radius) var(--radius); overflow-x:auto; box-shadow: var(--shadow); }
.link-cell{ color: var(--link); font-weight:600; }
.link-action{ color: var(--link); font-weight:600; font-size:13px; }

/* ==========================================================================
   9. FORMS (radio submission choice)
   ========================================================================== */
.radio-option{
  display:flex; gap:12px; align-items:flex-start;
  border:1.5px solid var(--border-strong); border-radius: var(--radius);
  padding:14px 16px; margin-bottom:10px; cursor:pointer;
  transition: border-color .15s ease, background .15s ease;
}
.radio-option:hover{ border-color: var(--primary); }
.radio-option.selected{ border-color: var(--primary); background: var(--primary-light); }
.radio-option input{ margin-top:3px; }
.radio-option .ro-title{ font-weight:700; font-size:14px; }
.radio-option .ro-sub{ font-size:12.5px; color:var(--text-muted); margin-top:3px; }
.radio-option .ro-sub.recommended{ color: var(--green); font-weight:600; }

/* Collapsible summary in Review screen */
.summary-toggle{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; padding:4px 0; }
.summary-toggle .st-left{ display:flex; align-items:center; gap:10px; }
.summary-body{ margin-top:12px; }
.summary-body[hidden]{ display:none; }

/* ==========================================================================
   10. SUCCESS / TOAST
   ========================================================================== */
.success-panel{ text-align:center; padding: 30px 20px 10px; }
.success-icon{
  width:56px; height:56px; border-radius:50%; background:var(--green-bg); border:2px solid var(--green-border);
  display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
}
.success-icon svg{ width:26px; height:26px; }
.pa-number{ font-family:'Poppins',sans-serif; font-size:22px; font-weight:700; color:var(--primary); margin:6px 0 4px; }
.toast{
  display:flex; align-items:center; gap:10px;
  background: var(--green-bg); border:1px solid var(--green-border); color:#175c3d;
  padding:12px 16px; border-radius: var(--radius-sm); font-size:13px; font-weight:600;
  margin-top:14px;
}

/* ==========================================================================
   11. CASE DETAIL — sub tabs + timeline
   ========================================================================== */
.case-summary-bar{
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
  background:#fff; border:1px solid var(--border); border-radius: var(--radius);
  padding:16px 20px; margin-bottom:18px; box-shadow: var(--shadow);
}
.case-summary-bar .csb-id{ font-family:'Poppins',sans-serif; font-weight:700; font-size:17px; }
.case-summary-bar .csb-sub{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }

.subtab-strip{ display:flex; gap:4px; background:#fff; border:1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; padding: 0 10px; overflow-x:auto; }
.subtab-item{ background:none; border:none; padding:13px 12px; font-size:13.5px; font-weight:600; color:var(--text-muted); border-bottom:3px solid transparent; white-space:nowrap; }
.subtab-item.active{ color:var(--primary); border-bottom-color:var(--primary); }
.subtab-panel{ background:#fff; border:1px solid var(--border); border-top:none; border-radius: 0 0 var(--radius) var(--radius); padding:22px 24px; box-shadow: var(--shadow); }

.timeline{ position:relative; padding-left:8px; }
.timeline-item{ position:relative; padding:0 0 26px 30px; }
.timeline-item:last-child{ padding-bottom:2px; }
.timeline-item::before{ /* connecting line */
  content:""; position:absolute; left:6px; top:18px; bottom:-8px; width:2px; background: var(--border);
}
.timeline-item:last-child::before{ display:none; }
.timeline-dot{ position:absolute; left:0; top:2px; width:14px; height:14px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px currentColor; }
.timeline-dot.blue{ background:var(--blue-pill); color:var(--blue-pill); }
.timeline-dot.amber{ background:var(--amber); color:var(--amber); }
.timeline-dot.green{ background:var(--green); color:var(--green); }
.timeline-dot.teal{ background:var(--teal); color:var(--teal); }
.timeline-dot.red{ background:var(--red); color:var(--red); }
.timeline-dot.gray{ background:var(--gray-pill); color:var(--gray-pill); }
.timeline-status{ font-weight:700; font-size:14px; }
.timeline-ts{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }

.evidence-card{ display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; }
.evidence-icon{ font-size:34px; flex:0 0 auto; }
.immutable-tag{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:#6931b0; background:#f2ecfb; border:1px solid #ddccf3; padding:3px 9px; border-radius:999px; margin-bottom:8px; }

.kv-mini{ display:grid; grid-template-columns: 180px 1fr; gap:10px 16px; font-size:13.5px; }
.kv-mini dt{ color:var(--text-muted); font-weight:600; }
.kv-mini dd{ margin:0; font-weight:600; }

.empty-note{ font-size:13px; color:var(--text-light); padding: 6px 0; }
.footer-note{ text-align:center; font-size:12px; color:var(--text-light); margin-top:36px; }
</style>
</head>
<body>

<!-- ============================================================
     HEADER + NAVIGATION (persistent across all 6 screens)
     ============================================================ -->
<header class="app-header">
  <div class="app-header-left">
    <span class="app-header-title">Provider Portal</span>
    <span class="app-header-badge">CRD &middot; DTR &middot; PAS &mdash; SMART on FHIR Prior Authorization</span>
  </div>

function esc(str){
  return String(str).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

}

function srcBadge(source){
  if(source === "emr") return '<span class="src-badge emr">EMR</span>';
  if(source === "pa") return '<span class="src-badge pa">Patient Access</span>';
  if(source === "upload") return '<span class="src-badge upload">Uploaded</span>';
  return "";
}

function pillHtml(status){
  const color = STATUS_COLOR[status] || "gray";
  return '<span class="pill pill-' + color + '"><span class="pill-dot"></span>' + esc(status) + '</span>';
}

function channelBadge(channel){
  if(channel === "FHIR") return '<span class="channel-badge fhir">FHIR PAS</span>';
  return '<span class="channel-badge edi">EDI 275/278</span>';
}

function findCase(authId){

function dtrMetCount(){

// ---- 3. DTR — MEDICAL NECESSITY MATCH ------------------------------------
function renderDtr(){
  const metCount = dtrMetCount();
  const pct = Math.round((metCount/3)*100);

  const groupsHtml = state.dtrGroups.map(function(g){
    const isOpen = state.dtrExpanded[g.id];
    const statusPill = g.status === "met"
      ? '<span class="pill pill-green"><span class="pill-dot"></span>Met</span>'
      : '<span class="pill pill-amber"><span class="pill-dot"></span>GAP</span>';

    let bodyHtml = "";
    if(g.id === 1 || g.id === 2){
      bodyHtml = `
        <div class="leaf-row">
          <span class="leaf-code">${esc(g.leaf.code)}</span>
          <div style="font-size:13px; margin-top:6px; color:var(--text);">${esc(g.leaf.label)}</div>
          <div class="leaf-evidence"><b>Evidence:</b> ${esc(g.leaf.evidence)} ${srcBadge(g.leaf.source)}</div>
        </div>
      `;
    } else {
      // group 3 — comorbidity, gap or met-via-upload
      const codeList = g.candidateCodes.map(function(c){
        return `<li class="gap-code-item"><span class="gap-dot"></span><code>${esc(c.code)}</code> ${esc(c.label)}</li>`;
      }).join("");

      if(g.status === "met" && g.uploaded){
        bodyHtml = `
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:6px;">Acceptable diagnosis codes (any one required):</p>
          <ul class="gap-code-list">${codeList}</ul>
          <div class="leaf-row" style="border-bottom:none;">
            <div class="leaf-evidence" style="color:var(--green); font-weight:600;">
              <b style="color:var(--green);">Evidence:</b> ${esc(g.evidence)} ${srcBadge("upload")}
            </div>
          </div>
        `;
      } else {
        bodyHtml = `
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:6px;">Acceptable diagnosis codes (any one required):</p>
          <ul class="gap-code-list">${codeList}</ul>
          <p class="gap-note">No matching diagnosis found in EMR or Patient Access data for this requirement.</p>
          ${state.uploadZoneOpen ? renderDropzone() : `<button class="btn btn-secondary btn-sm" data-action="open-upload">Upload Supporting Documentation</button>`}
        `;
      }
    }

    return `
      <div class="tree-group ${isOpen ? "open" : ""}">
        <button class="tree-group-head" data-action="toggle-group" data-group="${g.id}">
          <span class="tree-group-head-left">
            <span class="chevron"></span>
            <span class="tree-group-title"><span class="grp-num">Group ${g.id}</span>${esc(g.title)}</span>
          </span>
          ${statusPill}
        </button>
        ${isOpen ? `<div class="tree-group-body">${bodyHtml}</div>` : ""}
      </div>
    `;
  }).join("");

  const allMet = metCount === 3;

  document.getElementById("view-dtr").innerHTML = `
    <div class="page-head-row">
      <div>
        <h1 class="page-title">DTR &mdash; Medical Necessity Match</h1>

      <div>

        <span class="pc-text">${metCount} of 3 requirement groups met</span>
        <span class="progress-track"><span class="progress-fill" style="width:${pct}%;"></span></span>

      </div>
    </div>

    <div class="patient-banner">
      <div><div class="pb-name">${esc(PATIENT.name)}</div></div>
      <div class="pb-field"><b>DOB:</b> ${esc(PATIENT.dob)}</div>
      <div class="pb-field"><b>Member ID:</b> ${esc(PATIENT.memberId)}</div>
      <div class="pb-field"><b>Procedure:</b> ${esc(ORDER.procedure)} (CPT ${esc(ORDER.cpt)})</div>
    </div>

    <div class="card">
      <div class="summary-toggle" data-action="toggle-summary" data-target="checklist">
        <div class="st-left">
          <span class="pill pill-green"><span class="pill-dot"></span>5 of 5</span>
          <span class="card-title">Part I &middot; CRD Checklist</span>
        </div>
        <span class="chevron" style="transform:rotate(${checklistExpanded ? "45deg" : "-45deg"});"></span>
      </div>
      <div class="summary-body" ${checklistExpanded ? "" : "hidden"}>${checklistDetail}</div>
    </div>

    <div class="card">
      <div class="summary-toggle" data-action="toggle-summary" data-target="dtr">
        <div class="st-left">
          <span class="pill pill-green"><span class="pill-dot"></span>${dtrMetCount()} of 3</span>
          <span class="card-title">Part II &middot; DTR Match Results</span>
        </div>
        <span class="chevron" style="transform:rotate(${dtrExpanded ? "45deg" : "-45deg"});"></span>
      </div>
      <div class="summary-body" ${dtrExpanded ? "" : "hidden"}>${dtrDetail}</div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title-sm">Submission Channel</span></div>

      <label class="radio-option ${state.channel === "fhir" ? "selected" : ""}">
        <input type="radio" name="channel" value="fhir" ${state.channel === "fhir" ? "checked" : ""} data-action="channel-radio" />
        <div>
          <div class="ro-title">Submit as FHIR PAS Bundle (Claim/$submit)</div>
          <div class="ro-sub recommended">Recommended &mdash; payer supports FHIR-based Prior Authorization Support (PAS)</div>
        </div>
      </label>

      <label class="radio-option ${state.channel === "edi" ? "selected" : ""}">
        <input type="radio" name="channel" value="edi" ${state.channel === "edi" ? "checked" : ""} data-action="channel-radio" />
        <div>
          <div class="ro-title">Submit as X12 275/278 (EDI)</div>
          <div class="ro-sub">Legacy transaction set, routed through clearinghouse</div>
        </div>
      </label>
    </div>

    <div class="card" id="submitCard" style="text-align:center;">
      ${state.submitLoading ? renderSubmitLoading() : (state.submission ? renderSubmitSuccess() : renderSubmitButton())}
    </div>
  `;
}

function renderSubmitButton(){
  return `
    <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">Ready to submit. This will generate a Prior Authorization number and route the request to the payer.</p>
    <button class="btn btn-primary" data-action="submit-pa" style="padding:14px 30px; font-size:14.5px;">Submit Prior Authorization</button>
  `;
}

function renderSubmitLoading(){
  return `
    <div class="loading-block">
      <div class="spinner"></div>
      <div class="loading-text">Submitting to payer&hellip;</div>
      <div class="loading-sub">Generating PA number and routing request</div>
    </div>
  `;
}

function renderSubmitSuccess(){
  return `
    <div class="success-panel">
      <div class="success-icon">${checkIconSvg()}</div>
      <div style="font-size:13.5px; color:var(--text-muted);">Prior Authorization Submitted</div>
      <div class="pa-number">${esc(state.submission.paNumber)}</div>
      <div style="font-size:12.5px; color:var(--text-light);">${esc(state.submission.timestamp)}</div>
      <div class="toast">${checkIconSvg()} Case added to PA Portal with status <b style="margin-left:4px;">Submitted</b></div>
      <div style="margin-top:18px;">
        <button class="btn btn-primary" data-action="goto-portal">View in PA Portal</button>
      </div>
    </div>
  `;
}

// ---- 5. PA PORTAL ----------------------------------------------------------
function tabToStatus(tab){
  if(tab === "Partially Approved") return "Partially Approved / Modified";
  return tab;
}

function renderPortal(){
  const filtered = state.portalTab === "All"
    ? state.cases
    : state.cases.filter(function(c){ return c.status === tabToStatus(state.portalTab); });

  const tabsHtml = PORTAL_TABS.map(function(t){
    const count = t === "All" ? state.cases.length : state.cases.filter(function(c){ return c.status === tabToStatus(t); }).length;
    return `<button class="tab-item ${state.portalTab === t ? "active" : ""}" data-action="portal-filter" data-tab="${t}">${t}<span class="tab-count">${count}</span></button>`;
  }).join("");

  const rowsHtml = filtered.length ? filtered.map(function(c){
    return `
      <tr data-action="view-case" data-case-id="${esc(c.authId)}">
        <td class="link-cell">${esc(c.authId)}</td>
        <td>${esc(c.patient)}</td>
        <td>${esc(c.service)}</td>
        <td>${esc(c.dateRequested)}</td>
        <td>${channelBadge(c.channel)}</td>
        <td>${pillHtml(c.status)}</td>
        <td><span class="link-action" data-action="view-case" data-case-id="${esc(c.authId)}">View &rarr;</span></td>
      </tr>
    `;
  }).join("") : `<tr><td colspan="7" class="empty-note">No authorizations match this filter.</td></tr>`;

  document.getElementById("view-portal").innerHTML = `
    <div class="page-head-row">
      <div>
        <h1 class="page-title">Authorizations</h1>
        <p class="page-subtitle">Prior authorization requests submitted via FHIR PAS or X12 EDI 275/278.</p>
      </div>
      <button class="btn btn-primary" data-action="nav-goto" data-view="order">+ New Request</button>
    </div>

    <div class="tab-strip">${tabsHtml}</div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Auth ID</th><th>Patient</th><th>Service</th><th>Date Requested</th><th>Channel</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
}

// ---- 6. CASE DETAIL ---------------------------------------------------------
const CASE_SUBTABS = [
  { key: "checklist", label: "Checklist" },
  { key: "dtr", label: "DTR Snapshot" },
  { key: "submission", label: "Submission" },
  { key: "evidence", label: "Evidence Record" },
  { key: "timeline", label: "Adjudication Timeline" }
];

function renderCase(){
  const c = findCase(state.activeCaseId) || state.cases[0];
  if(!c){
    document.getElementById("view-case").innerHTML = `<div class="card"><p class="empty-note">No case selected. Go to PA Portal and choose a case.</p></div>`;
    return;
  }
  state.activeCaseId = c.authId;

  const subtabsHtml = CASE_SUBTABS.map(function(t){
    return `<button class="subtab-item ${state.caseTab === t.key ? "active" : ""}" data-action="case-tab" data-tab="${t.key}">${t.label}</button>`;
  }).join("");

  let panelHtml = "";
  if(state.caseTab === "checklist"){
    panelHtml = `
      <p class="card-title-sm" style="margin-bottom:14px;">Part I &middot; CRD Checklist (read-only)</p>
      <div class="checklist">
        ${c.checklist.map(function(item){
          return `<div class="checklist-row"><span class="check-icon">${checkIconSvg()}</span><div><div class="cl-label">${esc(item.label)}${srcBadge(item.source)}</div><div class="cl-detail">${esc(item.detail)}</div></div></div>`;
        }).join("")}
      </div>
    `;
  } else if(state.caseTab === "dtr"){
    panelHtml = `
      <p class="card-title-sm" style="margin-bottom:14px;">Part II &middot; DTR Snapshot (read-only, collapsed)</p>
      <div class="checklist">
        ${c.dtr.map(function(g){
          const isMet = g.status === "met";
          const iconHtml = isMet
            ? `<span class="check-icon">${checkIconSvg()}</span>`
            : `<span class="check-icon" style="background:var(--amber-bg); border-color:var(--amber-border);">!</span>`;
          return `<div class="checklist-row">${iconHtml}<div><div class="cl-label">${esc(g.title)} ${isMet ? '<span class="pill pill-green" style="margin-left:6px;">Met</span>' : '<span class="pill pill-amber" style="margin-left:6px;">GAP</span>'}</div><div class="cl-detail"><b>Evidence:</b> ${esc(g.evidence)} ${srcBadge(g.source)}</div></div></div>`;
        }).join("")}
      </div>
    `;
  } else if(state.caseTab === "submission"){
    panelHtml = `
      <p class="card-title-sm" style="margin-bottom:16px;">Submission Details</p>
      <dl class="kv-mini">
        <dt>Payload Type</dt><dd>${esc(c.submission.payloadType)}</dd>
        <dt>Submitted</dt><dd>${esc(c.submission.timestamp)}</dd>
        <dt>Payer Endpoint</dt><dd>${esc(c.submission.payerEndpoint)}</dd>
        <dt>Channel</dt><dd>${channelBadge(c.channel)}</dd>
      </dl>
    `;
  } else if(state.caseTab === "evidence"){
    panelHtml = `
      <div class="evidence-card">
        <div class="evidence-icon">&#128196;</div>
        <div style="flex:1; min-width:220px;">
          <div class="immutable-tag">Immutable Snapshot</div>
          <p style="font-size:13.5px; color:var(--text-muted); margin-bottom:14px; max-width:520px;">
            A point-in-time PDF snapshot of the submitted PAS Bundle and the medical necessity match criteria used at the moment of submission. This record does not change even if payer policy or documentation is later updated.
          </p>
          <button class="btn btn-secondary" data-action="download-evidence" data-case-id="${esc(c.authId)}">Download Evidence PDF</button>
          <div id="evidenceMsg"></div>
        </div>
      </div>
    `;
  } else if(state.caseTab === "timeline"){
    panelHtml = `
      <p class="card-title-sm" style="margin-bottom:18px;">Adjudication Timeline</p>
      <div class="timeline">
        ${c.timeline.map(function(t){
          return `
            <div class="timeline-item">
              <span class="timeline-dot ${t.color}"></span>
              <div class="timeline-status">${esc(t.status)}</div>
              <div class="timeline-ts">${esc(t.ts)}</div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  document.getElementById("view-case").innerHTML = `
    <div class="page-head-row">
      <div>
        <button class="btn-ghost" data-action="nav-goto" data-view="portal" style="padding-left:0;">&larr; Back to PA Portal</button>
        <h1 class="page-title" style="margin-top:6px;">Case Detail</h1>
      </div>
    </div>

    <div class="case-summary-bar">
      <div>
        <div class="csb-id">${esc(c.authId)} &middot; ${esc(c.patient)}</div>
        <div class="csb-sub">${esc(c.service)} (CPT ${esc(c.cpt)}) &middot; Requested ${esc(c.dateRequested)} &middot; ${channelBadge(c.channel)}</div>
      </div>
      ${pillHtml(c.status)}
    </div>

    <div class="subtab-strip">${subtabsHtml}</div>
    <div class="subtab-panel">${panelHtml}</div>
  `;
}

/* ============================================================================
   SECTION E — NAVIGATION / SHOW VIEW
   ============================================================================ */

const VIEW_RENDERERS = {
  order: renderOrder,
  checklist: renderChecklist,
  dtr: renderDtr,
  review: renderReview,
  portal: renderPortal,
  case: renderCase
};

function showView(view){
  state.view = view;
  Object.keys(VIEW_RENDERERS).forEach(function(key){
    document.getElementById("view-" + key).hidden = (key !== view);
  });
  document.querySelectorAll(".screen-nav-item").forEach(function(btn){
    btn.classList.toggle("active", btn.dataset.view === view);
  });
  VIEW_RENDERERS[view]();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

/* ============================================================================
   SECTION F — ACTION HANDLERS (event delegation)
   ============================================================================ */

document.addEventListener("click", function(e){
  const target = e.target.closest("[data-action]");
  if(!target) return;
  const action = target.dataset.action;

  switch(action){

    case "nav-goto":
      showView(target.dataset.view);
      break;

    case "crd-check":
      showView("checklist");
      state.crdLoading = true;
      renderChecklistLoading();
      setTimeout(function(){
        state.crdLoading = false;
        state.crdDone = true;
        renderChecklist();
      }, 600);
      break;

    case "goto-dtr":
      showView("dtr");
      break;

    case "toggle-group": {
      const gid = Number(target.closest("[data-group]").dataset.group);
      state.dtrExpanded[gid] = !state.dtrExpanded[gid];
      renderDtr();
      break;
    }

    case "open-upload":
      state.uploadZoneOpen = true;
      renderDtr();
      break;

    case "choose-file":
      document.getElementById("fileInput").click();
      break;

    case "continue-submit":
      if(dtrMetCount() === 3){
        showView("review");
      }
      break;

    case "toggle-summary": {
      const key = target.closest("[data-target]").dataset.target;
      state.reviewExpanded[key] = !state.reviewExpanded[key];
      renderReview();
      break;
    }

    case "submit-pa":
      state.submitLoading = true;
      renderReview();
      setTimeout(function(){
        state.submitLoading = false;
        const paNumber = "PA-2026-00417";
        const timestamp = "07/28/2026 9:14 AM";
        state.submission = { paNumber: paNumber, timestamp: timestamp };

        // Build the new case record from the live Part I / Part II results
        const newCase = {
          authId: paNumber,
          patient: PATIENT.name,
          memberId: PATIENT.memberId,
          service: ORDER.procedure,
          cpt: ORDER.cpt,
          dateRequested: "07/28/2026",
          channel: state.channel === "fhir" ? "FHIR" : "EDI",
          status: "Submitted",
          checklist: CRD_CHECKLIST.map(function(item){
            return { label: item.label, detail: item.detail, source: item.source };
          }),
          dtr: state.dtrGroups.map(function(g){
            const evidence = g.id === 3 ? (g.evidence || "") : g.leaf.evidence;
            const source = g.id === 3 ? "upload" : g.leaf.source;
            return { title: g.title, status: g.status, evidence: evidence, source: source };
          }),
          submission: {
            payloadType: state.channel === "fhir" ? "FHIR PAS Bundle (Claim/$submit)" : "X12 275/278 (EDI)",
            timestamp: timestamp,
            payerEndpoint: state.channel === "fhir"
              ? "https://payer-fhir.example-payer.com/R4/Claim/$submit"
              : "Clearinghouse: Availity → Payer EDI Gateway (275/278)"
          },
          timeline: [ { status: "Submitted", ts: timestamp, color: "blue" } ]
        };

        state.cases = state.cases.filter(function(c){ return c.authId !== paNumber; });
        state.cases.unshift(newCase);
        state.activeCaseId = paNumber;

        renderReview();
      }, 600);
      break;

    case "goto-portal":
      state.portalTab = "All";
      showView("portal");
      break;

    case "portal-filter":
      state.portalTab = target.dataset.tab;
      renderPortal();
      break;

    case "view-case":
      state.activeCaseId = target.dataset.caseId;
      state.caseTab = "checklist";
      showView("case");
      break;

    case "case-tab":
      state.caseTab = target.dataset.tab;
      renderCase();
      break;

    case "download-evidence": {
      const msgEl = document.getElementById("evidenceMsg");
      if(msgEl){
        msgEl.innerHTML = '<div class="toast">' + checkIconSvg() + ' Evidence_Record_' + esc(target.dataset.caseId) + '.pdf generated (simulated download) &mdash; immutable snapshot captured at submission time.</div>';
      }
      break;
    }

    default:
      break;
  }
});

// Radio button change (submission channel) — delegated change listener
document.addEventListener("change", function(e){
  if(e.target && e.target.dataset && e.target.dataset.action === "channel-radio"){
    state.channel = e.target.value;
    renderReview();
  }
});

// Simulated file upload for DTR Group 3
document.getElementById("fileInput").addEventListener("change", function(){
  const group3 = state.dtrGroups.find(function(g){ return g.id === 3; });
  group3.status = "met";
  group3.uploaded = true;
  group3.evidence = "Uploaded: sleep_study_report.pdf — pending clinical confirmation";
  state.uploadZoneOpen = false;
  state.dtrExpanded[3] = true;
  renderDtr();
  // reset the input so selecting the same file again still fires 'change'
  this.value = "";
});

/* ============================================================================
   SECTION G — INIT
   ============================================================================ */
showView("order");
</script>
</body>
</html>
